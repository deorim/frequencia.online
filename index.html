<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<title>Redirecionando...</title>

<!-- acelera conexão com CDN -->
<link rel="preconnect" href="https://cdn.utmify.com.br">
<link rel="dns-prefetch" href="//cdn.utmify.com.br">

<!-- script que captura UTMs -->
<script
src="https://cdn.utmify.com.br/scripts/utms/latest.js"
data-utmify-prevent-xcod-sck
data-utmify-prevent-subids
></script>

<!-- define pixel -->
<script>
window.pixelId="69b0e8b31239f29519878e9a";
</script>

<!-- carrega pixel -->
<script src="https://cdn.utmify.com.br/scripts/pixel/pixel.js"></script>

<script>

/* URL do checkout */

const checkoutBase =
"https://pay.cakto.com.br/j2a38uh";

/* pega UTMs */

const params = window.location.search;

/* redirect */

function irCheckout(){

window.location.replace(
checkoutBase + params
);

}

/* verifica se sessão utmify existe */

function sessaoCriada(){

try{

for(let i=0;i<localStorage.length;i++){

let key = localStorage.key(i);

if(key && key.toLowerCase().includes("utm")){
return true;
}

}

for(let i=0;i<sessionStorage.length;i++){

let key = sessionStorage.key(i);

if(key && key.toLowerCase().includes("utm")){
return true;
}

}

}catch(e){}

return false;

}

/* espera sessão existir */

let tentativas = 0;

function esperarSessao(){

if(sessaoCriada()){
irCheckout();
return;
}

tentativas++;

/* fallback máximo ~2s */

if(tentativas > 40){
irCheckout();
return;
}

setTimeout(esperarSessao,50);

}

/* inicia verificação */

esperarSessao();

</script>

</head>

<body>

Redirecionando...

</body>
</html>
