<script>

const checkout =
"https://pay.cakto.com.br/j2a38uh";

function redirect(){

const params = window.location.search;

window.location.replace(
checkout + params
);

}

function sessionExists(){

for(let i=0;i<localStorage.length;i++){

const key = localStorage.key(i);

if(key && key.toLowerCase().includes("utm")){
return true;
}

}

for(let i=0;i<sessionStorage.length;i++){

const key = sessionStorage.key(i);

if(key && key.toLowerCase().includes("utm")){
return true;
}

}

return false;

}

let tries = 0;

function waitSession(){

if(sessionExists()){
redirect();
return;
}

tries++;

if(tries>40){
redirect();
return;
}

setTimeout(waitSession,50);

}

waitSession();

</script>
