<script>
(function () {

    var STORAGE_KEY = "universal_tracking";
    var CHECKOUT_DOMAIN = "go.pepperpay.com.br";

    function captureParams() {
        var urlParams = new URLSearchParams(window.location.search);
        var stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        urlParams.forEach(function(value, key) {
            stored[key] = value;
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
    }

    function getParams() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    }

    function appendParamsToUrl(url, params) {
        try {
            var parsedUrl = new URL(url);
            Object.keys(params).forEach(function(key) {
                if (params[key] && !parsedUrl.searchParams.has(key)) {
                    parsedUrl.searchParams.set(key, params[key]);
                }
            });
            return parsedUrl.toString();
        } catch (e) {
            return url;
        }
    }

    function isPepperPay(url) {
        try {
            var parsedUrl = new URL(url, window.location.origin);
            return parsedUrl.hostname === CHECKOUT_DOMAIN;
        } catch (e) {
            return false;
        }
    }

    function applyTracking() {
        var params = getParams();
        if (!params || Object.keys(params).length === 0) return;

        var links = document.querySelectorAll("a");

        links.forEach(function(link) {
            if (!link.href) return;

            if (isPepperPay(link.href)) {
                link.href = appendParamsToUrl(link.href, params);
            }
        });
    }

    function handleDirectClicks() {
        document.addEventListener("click", function(e) {
            var target = e.target.closest("a");

            if (!target || !target.href) return;

            var params = getParams();
            if (!params || Object.keys(params).length === 0) return;

            if (isPepperPay(target.href)) {
                target.href = appendParamsToUrl(target.href, params);
            }
        }, true);
    }

    captureParams();

    document.addEventListener("DOMContentLoaded", function() {
        applyTracking();
        handleDirectClicks();
    });

    var observer = new MutationObserver(function () {
        applyTracking();
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });

})();
</script>
