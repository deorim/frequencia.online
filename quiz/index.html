<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelatina Bariátrica</title>
  <link rel="stylesheet" href="style.css">

  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer
  ></script>

  <script>
    window.pixelId = "69b0ee02780df3ca48ed1f5c";
    var a = document.createElement("script");
    a.setAttribute("async", "");
    a.setAttribute("defer", "");
    a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
    document.head.appendChild(a);
  </script>
</head>
<body>
  <div id="app">
    <div id="quiz"></div>
  </div>

  <script src="script.js"></script>

  <script>
(function () {

    var STORAGE_KEY = "universal_tracking";

    // 🔹 CAPTURA TODOS OS PARÂMETROS (QUALQUER UM)
    function captureParams() {
        var urlParams = new URLSearchParams(window.location.search);
        var stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        urlParams.forEach(function(value, key) {
            stored[key] = value;
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
    }

    // 🔹 RECUPERA
    function getParams() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    }

    // 🔹 MONTA QUERY STRING
    function buildQuery(params) {
        var query = [];

        for (var key in params) {
            if (params[key]) {
                query.push(key + "=" + encodeURIComponent(params[key]));
            }
        }

        return query.length ? query.join("&") : "";
    }

    // 🔹 VERIFICA SE É LINK EXTERNO (CHECKOUT)
    function isExternal(url) {
        try {
            var link = new URL(url);
            return link.hostname !== window.location.hostname;
        } catch (e) {
            return false;
        }
    }

    // 🔹 APLICA EM QUALQUER CHECKOUT
    function applyTracking() {
        var params = getParams();
        if (!params || Object.keys(params).length === 0) return;

        var queryString = buildQuery(params);

        var links = document.querySelectorAll("a");

        links.forEach(function(link) {
            if (!link.href) return;

            // 🔥 REGRA UNIVERSAL:
            // só aplica em links externos (checkout)
            if (isExternal(link.href)) {
                try {
                    var url = new URL(link.href);

                    // evita duplicação
                    if (url.search) {
                        link.href = url.href + "&" + queryString;
                    } else {
                        link.href = url.href + "?" + queryString;
                    }

                } catch (e) {}
            }
        });
    }

    // 🚀 EXECUÇÃO IMEDIATA (CRÍTICO)
    captureParams();

    document.addEventListener("DOMContentLoaded", applyTracking);

    // 🔄 QUIZ DINÂMICO / SPA
    var observer = new MutationObserver(function () {
        applyTracking();
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });

})();
</script>
</body>
</html>
