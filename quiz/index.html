<script>
(function () {
    var STORAGE_KEY = "universal_tracking";

    function captureParams() {
        try {
            var urlParams = new URLSearchParams(window.location.search);
            var stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

            urlParams.forEach(function(value, key) {
                stored[key] = value;
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
        } catch (e) {}
    }

    function getParams() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (e) {
            return {};
        }
    }

    function applyParamsToUrl(url, params) {
        try {
            var parsed = new URL(url, window.location.origin);

            for (var key in params) {
                if (params[key] && !parsed.searchParams.has(key)) {
                    parsed.searchParams.set(key, params[key]);
                }
            }

            return parsed.toString();
        } catch (e) {
            return url;
        }
    }

    function isPepperPay(url) {
        try {
            var parsed = new URL(url, window.location.origin);
            return parsed.hostname === "go.pepperpay.com.br";
        } catch (e) {
            return false;
        }
    }

    function applyTracking() {
        var params = getParams();
        if (!params || Object.keys(params).length === 0) return;

        var links = document.querySelectorAll("a");

        links.forEach(function(link) {
            if (!link.href) return;

            if (isPepperPay(link.href)) {
                link.href = applyParamsToUrl(link.href, params);
            }
        });
    }

    captureParams();

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", applyTracking);
    } else {
        applyTracking();
    }

    setInterval(applyTracking, 1000);
})();
</script>
